name: AERABOT V2 Frontend Verification

on:
  push:
    branches:
      - astra/aerabot-v2-presence

jobs:
  verify:
    name: Typecheck, tests, and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

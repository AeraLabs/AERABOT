name: AERA Desktop Builds

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: aera-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: Intel x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm install
      - name: Generate branded AERA app icons
        run: npm run icons
      - name: Verify generated app icons
        run: |
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/128x128@2x.png
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Verify native architecture
        run: |
          uname -m
          rustc -vV
      - name: Native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - name: Verify macOS runtime linkage
        run: |
          BIN="src-tauri/target/${{ matrix.target }}/release/aera-orb"
          echo "Linked libraries:"
          otool -L "$BIN"
          echo "Runtime search paths:"
          otool -l "$BIN" | grep -A3 LC_RPATH || true

          if otool -L "$BIN" | grep -q '@rpath/libswiftCore.dylib'; then
            if ! otool -l "$BIN" | grep -A3 LC_RPATH | grep -q '/usr/lib/swift'; then
              echo "::error::Swift runtime is linked through @rpath but /usr/lib/swift is missing from LC_RPATH."
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aera-macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm install
      - name: Generate branded AERA app icons
        run: npm run icons
      - name: Verify generated app icons
        shell: bash
        run: |
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/128x128@2x.png
      - name: Build frontend for Tauri context
        run: npm run build
      - name: Native Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: aera-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#18242d"/>
      <stop offset="58%" stop-color="#0b1117"/>
      <stop offset="100%" stop-color="#030507"/>
    </radialGradient>
    <radialGradient id="glass" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#dff8ff" stop-opacity=".34"/>
      <stop offset="28%" stop-color="#7fd9ef" stop-opacity=".12"/>
      <stop offset="70%" stop-color="#0f4057" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#07141d" stop-opacity=".62"/>
    </radialGradient>
    <linearGradient id="waveA" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#87f2dd"/>
      <stop offset="45%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#80d8ff"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0%" y1="65%" x2="100%" y2="35%">
      <stop offset="0%" stop-color="#72c8ff"/>
      <stop offset="55%" stop-color="#85f1d2"/>
      <stop offset="100%" stop-color="#e9fbff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="orbClip">
      <circle cx="512" cy="512" r="340"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="214" fill="url(#bg)"/>
  <rect x="48" y="48" width="928" height="928" rx="198" fill="none" stroke="#b9ecff" stroke-opacity=".16" stroke-width="3"/>

  <circle cx="512" cy="512" r="354" fill="#6de5ff" opacity=".10" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="340" fill="url(#glass)" stroke="#c6f3ff" stroke-opacity=".82" stroke-width="8"/>

  <g clip-path="url(#orbClip)">
    <ellipse cx="430" cy="386" rx="245" ry="184" fill="#ffffff" opacity=".06" transform="rotate(-20 430 386)"/>
    <path d="M130 562 C 260 420, 356 414, 494 532 S 744 660, 894 484"
          fill="none" stroke="url(#waveA)" stroke-width="30" stroke-linecap="round" opacity=".30" filter="url(#soft)"/>
    <path d="M130 562 C 260 420, 356 414, 494 532 S 744 660, 894 484"
          fill="none" stroke="url(#waveA)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M132 486 C 278 648, 392 642, 528 510 S 748 382, 894 556"
          fill="none" stroke="url(#waveB)" stroke-width="27" stroke-linecap="round" opacity=".26" filter="url(#soft)"/>
    <path d="M132 486 C 278 648, 392 642, 528 510 S 748 382, 894 556"
          fill="none" stroke="url(#waveB)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M170 612 C 330 516, 410 500, 536 566 S 716 620, 850 518"
          fill="none" stroke="#ffffff" stroke-opacity=".66" stroke-width="5" stroke-linecap="round"/>

    <g fill="#d9ffff">
      <circle cx="312" cy="486" r="7"/><circle cx="352" cy="582" r="5"/>
      <circle cx="398" cy="448" r="4"/><circle cx="438" cy="536" r="6"/>
      <circle cx="476" cy="596" r="4"/><circle cx="528" cy="456" r="6"/>
      <circle cx="566" cy="566" r="5"/><circle cx="614" cy="500" r="4"/>
      <circle cx="664" cy="604" r="6"/><circle cx="704" cy="452" r="4"/>
    </g>
    <g fill="#7ff4d8" opacity=".84">
      <circle cx="332" cy="532" r="4"/><circle cx="452" cy="476" r="3"/>
      <circle cx="548" cy="616" r="4"/><circle cx="634" cy="544" r="3"/>
      <circle cx="744" cy="520" r="4"/>
    </g>
  </g>

  <path d="M274 330 A340 340 0 0 1 720 230"
        fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="12" stroke-linecap="round"/>
  <path d="M250 360 A340 340 0 0 1 418 226"
        fill="none" stroke="#9fe7ff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="326" fill="none" stroke="#77dfff" stroke-opacity=".28" stroke-width="3"/>
</svg>